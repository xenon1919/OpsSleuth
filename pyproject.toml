[project]
name = "opssleuth"
version = "0.1.0"
description = "Agentic incident-investigation engine with Corrective RAG"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-aiplatform>=1.70",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.2",
    "ragas>=0.2",
    "deepeval>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
