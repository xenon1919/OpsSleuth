[project]
name = "opssleuth"
version = "0.1.0"
description = "Agentic incident-investigation engine with Corrective RAG"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-aiplatform>=1.70",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
opssleuth-ingest = "opssleuth.cli.ingest:main"
opssleuth-query = "opssleuth.cli.query:main"
opssleuth-evaluate = "opssleuth.cli.evaluate:main"
opssleuth-serve = "opssleuth.cli.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: hits real GCP (Vertex AI) APIs; skipped by default, run with `-m integration`.",
]
addopts = "-m 'not integration'"
